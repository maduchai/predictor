<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN · Hai×bo</title>
<style>
  :root{ --bg:#0a0000; --panel:#1a0000; --red:#ff3333; --gold:#ffd700; --green:#00e676; --cyan:#00e5ff; }
  *{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
  body{ background:radial-gradient(circle at 50% -20%, #330000 0%, var(--bg) 70%); color:#ffe6e6; padding:20px; display:flex; justify-content:center; min-height:100vh; }
  .app{ width:100%; max-width:1000px; }
  .header{ text-align:center; margin-bottom:20px; }
  .header h1{ color:var(--red); text-shadow:0 0 15px var(--red); font-size:2rem; }
  .card{ background:linear-gradient(180deg,rgba(30,0,0,0.9) 0%, #0a0000 100%); padding:20px; border-radius:12px; border:1px solid #551111; margin-bottom:20px; }
  h2{ color:var(--red); margin-bottom:15px; font-size:1.1rem; border-bottom:1px solid #551111; padding-bottom:5px; text-transform:uppercase; }
  input, select{ width:100%; padding:10px; margin-bottom:10px; background:#000; border:1px solid #551111; color:#fff; border-radius:6px; outline:none; }
  button{ background:var(--red); color:#fff; border:none; padding:10px 15px; border-radius:6px; cursor:pointer; font-weight:bold; transition:0.2s;}
  button:hover { filter: brightness(1.2); }
  .btn-g{ background:var(--green); color:#000; } 
  .btn-c{ background:var(--cyan); color:#000;}
  .btn-sm { padding: 5px 10px; font-size: 0.8rem; }
  table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:0.85rem; text-align:left; }
  th,td{ padding:10px; border-bottom:1px solid #551111; }
  th{ color:var(--gold); font-size:0.8rem; text-transform:uppercase;}
  .hidden{ display:none!important; }
  .status-pending { color: #ffd700; font-weight: bold; }
  .status-done { color: #00e676; font-weight: bold; }
  .header-bar { display:flex; justify-content:space-between; align-items:center; background:#0a0000; padding:10px 20px; border-radius:8px; margin-bottom:20px; border:1px solid var(--red); flex-wrap:wrap; gap:10px;}
</style>
</head>
<body>
<div class="app">
  <div class="header"><h1>ADMIN DASHBOARD</h1></div>

  <div id="authView" class="card" style="max-width:400px; margin:0 auto;">
    <h2>Đăng Nhập</h2>
    <input id="adminPass" type="password" placeholder="Mật khẩu...">
    <button onclick="login()" style="width:100%">VÀO HỆ THỐNG</button>
    <div id="loginMsg" style="color:var(--red); font-weight:bold; text-align:center; margin-top:10px;"></div>
  </div>

  <div id="adminPanel" class="hidden">
    <div class="header-bar">
      <div style="color:var(--red); font-weight:bold; letter-spacing:1px;">HỆ THỐNG QUẢN LÝ</div>
      <div style="display:flex; gap:10px;">
        <button class="btn-c btn-sm" onclick="changePassword()">🔑 Đổi Mật Khẩu</button>
        <button class="btn-sm" onclick="location.reload()">Đăng Xuất</button>
      </div>
    </div>

    <div class="card">
      <h2>Duyệt Nạp Tiền (Tự Động Cập Nhật)</h2>
      <table>
        <thead><tr><th>Mã TB</th><th>Hình thức</th><th>IP / Tỉnh</th><th>Thiết bị</th><th>Thông tin</th><th>Hành động</th></tr></thead>
        <tbody id="depList"><tr><td colspan="6" style="text-align:center; color:#888;">Đang tải dữ liệu...</td></tr></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Tạo Key Kích Hoạt</h2>
      <div style="display:flex; gap:10px; margin-bottom:10px;">
        <select id="keyDuration" style="flex:1;">
          <option value="1">1 Ngày (25k)</option><option value="7">1 Tuần (75k)</option><option value="30">1 Tháng (200k)</option><option value="0">Vĩnh Viễn (450k)</option>
        </select>
        <input type="number" id="keyDeviceLimit" value="1" min="1" style="flex:1;" title="Số thiết bị được dùng">
        <button class="btn-c" onclick="createKey()" style="flex:1;">Tạo Key</button>
      </div>
      <div id="keyResult" style="background:#000; padding:15px; border:1px dashed var(--gold); color:var(--gold); text-align:center; font-size:1.2rem; font-weight:bold; display:none; letter-spacing:1px;"></div>
    </div>

    <div class="card">
      <h2>Danh Sách Key Đã Tạo</h2>
      <table>
        <thead><tr><th>Mã Key</th><th>Hạn Sử Dụng</th><th>Thiết bị (Đã dùng / Tối đa)</th><th>Trạng Thái</th><th>Hành động</th></tr></thead>
        <tbody id="keyList"><tr><td colspan="5" style="text-align:center; color:#888;">Đang tải dữ liệu...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  window.onerror = function(msg) { alert("Lỗi: " + msg); };

  const firebaseConfig = {
    apiKey: "AIzaSyAaQg91q7wMeQ4kXyCnOQuolvN_KmJoHBI",
    authDomain: "vip1-c45cb.firebaseapp.com",
    projectId: "vip1-c45cb",
    storageBucket: "vip1-c45cb.firebasestorage.app",
    messagingSenderId: "191209527323",
    appId: "1:191209527323:web:b908c85ad00bfb6c2ac0be",
    databaseURL: "https://vip1-c45cb-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1561068482504691742/R5_eAJ4B5QaQ7iGpCORqd8ZPwTiYDVJuUucjiiYqaMS4NjfN-zQ6cAvupv-IW9lN54Ke";
  const getPass = () => localStorage.getItem('admin_password') || "admin123";

  function login() {
    if(document.getElementById('adminPass').value === getPass()) {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      loadDeposits();
      loadKeys();
    } else { document.getElementById('loginMsg').innerText = "Sai mật khẩu!"; }
  }

  function changePassword() {
    const oldPass = prompt("Nhập mật khẩu hiện tại:");
    if(oldPass !== getPass()) return alert("Mật khẩu cũ sai!");
    const newPass = prompt("Nhập mật khẩu MỚI:");
    if(newPass && newPass.trim() !== "") { localStorage.setItem('admin_password', newPass.trim()); alert("Đổi mật khẩu thành công!"); }
  }

  function createKey() {
    const days = parseInt(document.getElementById('keyDuration').value);
    const maxDevices = parseInt(document.getElementById('keyDeviceLimit').value) || 1;
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let key = "HB-";
    for(let i=0; i<12; i++) { if(i === 4 || i === 8) key += "-"; key += chars.charAt(Math.floor(Math.random() * chars.length)); }
    
    let expireTime = days === 0 ? 0 : Date.now() + (days * 24 * 60 * 60 * 1000);
    db.ref('keys/' + key).set({ duration: days === 0 ? "Vĩnh viễn" : days + " Ngày", expire: expireTime, maxDevices: maxDevices, usedDevices: {}, createdAt: new Date().toLocaleString('vi-VN'), timestamp: Date.now() })
    .then(() => {
      let el = document.getElementById('keyResult'); el.style.display = "block"; el.innerText = key;
      fetch(DISCORD_WEBHOOK, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: "Admin Hai×bo", embeds: [{ title: "🔑 ĐÃ TẠO KEY MỚI!", color: 16776960, description: `**Key:** \`${key}\`\n**Hạn:** ${days === 0 ? "Vĩnh viễn" : days + " Ngày"}\n**Giới hạn:** ${maxDevices} thiết bị`, timestamp: new Date().toISOString() }] })
      });
    });
  }

  function loadKeys() {
    const keyList = document.getElementById('keyList');
    db.ref('keys').on('value', snap => {
      keyList.innerHTML = "";
      if(!snap.exists()) { keyList.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Chưa có key nào</td></tr>"; return; }
      const arr = Object.keys(snap.val()).map(k => ({ key: k, ...snap.val()[k] })).sort((a,b)=>b.timestamp - a.timestamp);
      arr.forEach(item => {
        const isExpired = item.expire !== 0 && item.expire < Date.now();
        const statusHtml = isExpired ? `<span style="color:#ff5252">Hết hạn</span>` : `<span style="color:#00e676">Hoạt động</span>`;
        const usedCount = item.usedDevices ? Object.keys(item.usedDevices).length : 0;
        const maxDev = item.maxDevices || 1;
        const deviceStatus = usedCount >= maxDev ? `<span style="color:#ff5252">${usedCount}/${maxDev} (Đầy)</span>` : `<span style="color:#00e5ff">${usedCount}/${maxDev}</span>`;
        keyList.innerHTML += `<tr><td style="color:var(--gold); font-weight:bold; user-select:all">${item.key}</td><td>${item.duration}</td><td>${deviceStatus}</td><td>${statusHtml}</td><td><button class="btn-sm" style="background:#551111;" onclick="deleteKey('${item.key}')">Xóa</button></td></tr>`;
      });
    });
  }

  function deleteKey(key) { if(confirm("Xóa key: " + key + " ?")) db.ref('keys/' + key).remove(); }

  function loadDeposits() {
    const depList = document.getElementById('depList');
    db.ref('deposits').on('value', snap => {
      depList.innerHTML = "";
      if(!snap.exists()) { depList.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Chưa có đơn nào</td></tr>"; return; }
      const arr = Object.keys(snap.val()).map(k => ({ id: k, ...snap.val()[k] })).sort((a,b)=>b.timestamp - a.timestamp);
      arr.forEach(dep => {
        const btn = dep.status === 'pending' ? `<button class="btn-g btn-sm" onclick="approveDeposit('${dep.id}')">Duyệt</button>` : '<span class="status-done">Đã duyệt</span>';
        let info = dep.method === 'Thẻ Cào' ? `${dep.type} - ${parseInt(dep.amount).toLocaleString()}đ` : `Nội dung: ${dep.deviceCode} (${parseInt(dep.amount).toLocaleString()}đ)`;
        depList.innerHTML += `<tr><td style="color:var(--gold); font-weight:bold;">${dep.deviceCode}</td><td>${dep.method}</td><td><b>IP:</b> ${dep.ip}<br><small style="color:#aaa;">${dep.location}</small></td><td>${dep.device}</td><td>${info}</td><td>${btn}</td></tr>`;
      });
    });
  }

  // DUYỆT CỘNG TIỀN VÀO ĐÚNG MÃ THIẾT BỊ
  function approveDeposit(id) {
    if(!confirm("Xác nhận đã nhận được tiền và duyệt đơn này?")) return;
    
    db.ref('deposits/' + id).once('value').then(snap => {
      if(!snap.exists()) return;
      let dep = snap.val();
      if(dep.status !== 'pending') return;

      let devCode = dep.deviceCode;
      let amount = parseInt(dep.amount) || 0;

      if(amount > 0) {
        // Lấy số dư hiện tại của thiết bị đó
        db.ref('users/' + devCode + '/balance').once('value').then(balSnap => {
          let currentBal = balSnap.val() || 0;
          // Cộng tiền và cập nhật trạng thái
          db.ref('users/' + devCode + '/balance').set(currentBal + amount).then(() => {
            db.ref('deposits/' + id).update({ status: 'approved' }).then(() => {
              fetch(DISCORD_WEBHOOK, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: "Admin Hai×bo", embeds: [{ title: "✅ ĐÃ DUYỆT NẠP TIỀN!", color: 65280, description: `Đơn mã **${id}** đã cộng **${amount.toLocaleString()}đ** vào thiết bị **${devCode}**.`, timestamp: new Date().toISOString() }] })
              });
            });
          });
        });
      } else {
        db.ref('deposits/' + id).update({ status: 'approved' });
      }
    });
  }
</script>
</body>
</html>
