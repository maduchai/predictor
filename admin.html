<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN · Hai×bo</title>
<style>
  :root{ 
    --bg:#050a0f; --panel:#0a141e; --panel2:#0e1c28; 
    --line:#14324a; --txt:#e0f7fa; --dim:#6b92a8; 
    --cyan:#00e5ff; --green:#00e676; --red:#ff5252; --yel:#ffd166; --purple:#b57bff; 
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{ 
    background:radial-gradient(circle at 50% -20%, #0f2a3f 0%, var(--bg) 70%); 
    color:var(--txt); font-family:system-ui,sans-serif; padding:20px; 
    display:flex; justify-content:center; min-height:100vh; 
  }
  .app{ width:100%; max-width:1000px; }
  .header{ text-align:center; margin-bottom:30px; }
  .header h1{ color:var(--cyan); font-size:2rem; text-shadow:0 0 20px rgba(0,229,255,0.4); }
  .card{ 
    background:linear-gradient(180deg,var(--panel) 0%, var(--panel2) 100%); 
    padding:22px; border-radius:14px; border:1px solid var(--line); 
    margin-bottom:20px; box-shadow:0 10px 30px rgba(0,0,0,0.5); 
  }
  h2{ 
    color:var(--cyan); margin-bottom:15px; font-size:1.1rem; 
    text-transform:uppercase; display:flex; align-items:center; gap:8px;
  }
  h2::before{ 
    content:""; width:6px; height:6px; border-radius:50%; 
    background:var(--cyan); box-shadow:0 0 10px var(--cyan); 
  }
  input{ 
    width:100%; padding:12px; margin-bottom:10px; background:#060f16; 
    border:1px solid var(--line); color:var(--txt); border-radius:8px; font-family:inherit; 
  }
  input:focus{ border-color:var(--cyan); outline:none; }
  button{ 
    background:linear-gradient(135deg, #00b8d4, var(--cyan)); color:#000; 
    border:none; padding:12px 20px; border-radius:8px; cursor:pointer; 
    font-weight:800; transition:0.2s; font-family:inherit;
  }
  button:hover{ box-shadow:0 0 15px rgba(0,229,255,0.4); }
  .btn-sm{ padding:6px 10px; font-size:0.75rem; border-radius:6px; }
  .btn-green{ background:linear-gradient(135deg, #00b248, var(--green)); } 
  .btn-green:hover{ box-shadow:0 0 15px rgba(0,230,118,0.4); }
  .btn-red{ background:linear-gradient(135deg, #d32f2f, var(--red)); color:#fff; } 
  .btn-red:hover{ box-shadow:0 0 15px rgba(255,82,82,0.4); }
  .btn-purple{ background:linear-gradient(135deg, #8f5ce0, var(--purple)); color:#fff; }
  .btn-purple:hover{ box-shadow:0 0 15px rgba(181,123,255,0.4); }
  table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:0.9rem; }
  th,td{ padding:12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
  th{ color:var(--cyan); font-size:0.8rem; text-transform:uppercase; }
  .hidden{ display:none!important; }
  .msg{ margin-top:10px; font-size:0.85rem; color:var(--red); font-weight:bold; }
  .header-bar{ 
    display:flex; justify-content:space-between; align-items:center; 
    background:#060f16; padding:15px 20px; border-radius:10px; 
    margin-bottom:20px; border:1px solid var(--line); 
  }
</style>
</head>
<body>
<div class="app">
  <div class="header"><h1>ADMIN DASHBOARD</h1></div>

  <!-- ĐĂNG NHẬP ADMIN -->
  <div id="authView" class="card" style="max-width:400px; margin:0 auto;">
    <h2>Đăng Nhập Quản Trị</h2>
    <input id="adminPass" type="password" placeholder="Nhập mật khẩu Admin...">
    <button onclick="Admin.login()" style="width:100%">Vào Hệ Thống</button>
    <div id="authMsg" class="msg"></div>
  </div>

  <!-- BẢNG ĐIỀU KHIỂN ADMIN -->
  <div id="adminPanel" class="hidden">
    <div class="header-bar">
      <div style="color:var(--cyan); font-weight:bold; letter-spacing:1px">HỆ THỐNG QUẢN LÝ</div>
      <div>
        <button class="btn-sm btn-purple" onclick="Admin.changePass()" style="margin-right:10px">Đổi Pass</button>
        <button class="btn-sm btn-red" onclick="location.reload()">Đăng xuất</button>
      </div>
    </div>

    <!-- DUYỆT NẠP -->
    <div class="card">
      <h2>Duyệt Nạp Tiền</h2>
      <table>
        <thead>
          <tr><th>User</th><th>Phương Thức</th><th>Thông Tin</th><th>Mệnh Giá</th><th>Trạng thái</th><th>Hành động</th></tr>
        </thead>
        <tbody id="depositList"></tbody>
      </table>
    </div>

    <!-- QUẢN LÝ USER -->
    <div class="card">
      <h2>Quản Lý Tài Khoản</h2>
      <table>
        <thead>
          <tr><th>Tên</th><th>IP Gần Nhất</th><th>Mã CK</th><th>Số Xu</th><th>Cộng/Trừ & Xóa</th></tr>
        </thead>
        <tbody id="userList"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// Quản lý dữ liệu LocalStorage
const DB = {
  getUsers(){ return JSON.parse(localStorage.getItem('pred_users')) || []; },
  saveUsers(u){ localStorage.setItem('pred_users', JSON.stringify(u)); },
  getDeposits(){ return JSON.parse(localStorage.getItem('pred_deposits')) || []; },
  saveDeposits(d){ localStorage.setItem('pred_deposits', JSON.stringify(d)); },
  getUserById(id){ return this.getUsers().find(u => u.id === id); },
  updateUser(id, data){
    let users = this.getUsers();
    let idx = users.findIndex(u => u.id === id);
    if(idx > -1) { users[idx] = {...users[idx], ...data}; this.saveUsers(users); }
  },
  getAdminPass(){ return localStorage.getItem('admin_pass') || "admin123"; },
  setAdminPass(p){ localStorage.setItem('admin_pass', p); }
};

const Admin = {
  // Đăng nhập
  login(){
    const p = document.getElementById('adminPass').value;
    if(p !== DB.getAdminPass()){ 
      document.getElementById('authMsg').textContent = "Sai mật khẩu!";
      return; 
    }
    document.getElementById('authView').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    this.render();
  },

  // Đổi mật khẩu
  changePass(){
    const newPass = prompt("Nhập mật khẩu Admin mới:");
    if(!newPass || newPass.trim() === "") return alert("Mật khẩu không hợp lệ!");
    DB.setAdminPass(newPass.trim());
    alert("Đã đổi mật khẩu Admin thành công!");
  },

  // Hiển thị dữ liệu
  render(){
    // 1. Render danh sách nạp tiền
    const deps = DB.getDeposits().sort((a,b) => b.created_at - a.created_at);
    document.getElementById('depositList').innerHTML = deps.length ? deps.map(d => {
      // Tính xu theo tỷ lệ mới (10k=20, 100k=220, 400k=1000)
      let xu = 0;
      if(d.amount === 10000) xu = 20;
      else if(d.amount === 100000) xu = 220;
      else if(d.amount === 400000) xu = 1000;

      return `
      <tr>
        <td style="font-weight:bold">${d.username}</td>
        <td>${d.method}</td>
        <td style="font-size:0.85rem; color:var(--dim)">${d.info}</td>
        <td style="color:var(--green); font-weight:bold">${d.amount.toLocaleString()}đ (${xu} Xu)</td>
        <td style="color:${d.status==='pending'?'var(--yel)':'var(--green)'}; font-weight:bold">${d.status}</td>
        <td>${d.status === 'pending' ? `<button class="btn-sm btn-green" onclick="Admin.approve(${d.id})">Duyệt</button>` : 'Đã duyệt'}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="6" style="text-align:center; color:#666">Chưa có đơn nạp nào</td></tr>`;

    // 2. Render danh sách User
    const users = DB.getUsers();
    document.getElementById('userList').innerHTML = users.length ? users.map(u => `
      <tr>
        <td style="font-weight:bold; color:var(--cyan)">${u.username}</td>
        <td style="color:var(--purple); font-family:monospace">${u.ip || 'Không xác định'}</td>
        <td style="color:var(--yel)">${u.bankCode}</td>
        <td style="color:var(--yel); font-weight:bold; font-size:1.1rem">${u.xu || 0}</td>
        <td>
          <button class="btn-sm btn-green" onclick="Admin.editXu(${u.id}, 'add')">+ Xu</button>
          <button class="btn-sm btn-red" onclick="Admin.editXu(${u.id}, 'sub')" style="margin-left:5px">- Xu</button>
          <button class="btn-sm" onclick="Admin.deleteUser(${u.id})" style="background:#333; color:#fff; margin-left:5px">Xóa</button>
        </td>
      </tr>
    `).join('') : `<tr><td colspan="5" style="text-align:center; color:#666">Chưa có user nào đăng ký</td></tr>`;
  },

  // Duyệt đơn nạp
  approve(id){
    let deps = DB.getDeposits();
    let dep = deps.find(x => x.id === id);
    if(!dep || dep.status !== 'pending') return;
    
    // Tính xu
    let xuToAdd = 0;
    if(dep.amount === 10000) xuToAdd = 20;
    else if(dep.amount === 100000) xuToAdd = 220;
    else if(dep.amount === 400000) xuToAdd = 1000;

    let user = DB.getUserById(dep.userId);
    if(user) DB.updateUser(user.id, { xu: (user.xu || 0) + xuToAdd });
    
    dep.status = 'approved'; 
    DB.saveDeposits(deps);
    this.render();
  },

  // Thêm / Bớt Xu thủ công
  editXu(id, action){
    let user = DB.getUserById(id);
    if(!user) return;
    
    const str = prompt(`Nhập số Xu muốn ${action === 'add' ? 'CỘNG' : 'TRỪ'} cho [${user.username}]:`, "10");
    if(!str) return;
    const amount = parseInt(str);
    if(isNaN(amount) || amount <= 0) return alert("Số xu không hợp lệ!");

    let newXu = user.xu || 0;
    if(action === 'add') {
      newXu += amount;
    } else {
      if(newXu < amount) return alert("Tài khoản không đủ xu để trừ!");
      newXu -= amount;
    }
    
    DB.updateUser(id, { xu: newXu });
    this.render();
    alert(`Đã ${action === 'add' ? 'cộng' : 'trừ'} ${amount} xu thành công!`);
  },

  // Xóa User
  deleteUser(id){
    if(!confirm("Xóa vĩnh viễn user này? (Không thể hoàn tác)")) return;
    let users = DB.getUsers().filter(u => u.id !== id);
    DB.saveUsers(users); 
    this.render();
  }
};
</script>
</body>
</html>
