<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN · Hai×bo</title>
<style>
  :root{ --bg:#0a0000; --panel:#1a0000; --red:#ff3333; --gold:#ffd700; --green:#00e676; --cyan:#00e5ff; }
  *{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
  body{ background:radial-gradient(circle at 50% -20%, #330000 0%, var(--bg) 70%); color:#ffe6e6; padding:20px; display:flex; justify-content:center; min-height:100vh; }
  .app{ width:100%; max-width:1000px; }
  .header{ text-align:center; margin-bottom:20px; }
  .header h1{ color:var(--red); text-shadow:0 0 15px var(--red); font-size:2rem; }
  .card{ background:linear-gradient(180deg,rgba(30,0,0,0.9) 0%, #0a0000 100%); padding:20px; border-radius:12px; border:1px solid #551111; margin-bottom:20px; }
  h2{ color:var(--red); margin-bottom:15px; font-size:1.1rem; border-bottom:1px solid #551111; padding-bottom:5px; text-transform:uppercase; }
  input, select{ width:100%; padding:10px; margin-bottom:10px; background:#000; border:1px solid #551111; color:#fff; border-radius:6px; outline:none; }
  button{ background:var(--red); color:#fff; border:none; padding:10px 15px; border-radius:6px; cursor:pointer; font-weight:bold; }
  .btn-g{ background:var(--green); color:#000; } .btn-c{ background:var(--cyan); color:#000;}
  table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:0.85rem; }
  th,td{ padding:10px; text-align:left; border-bottom:1px solid #551111; }
  th{ color:var(--gold); font-size:0.8rem; text-transform:uppercase;}
  .hidden{ display:none!important; }
  .status-pending { color: #ffd700; font-weight: bold; }
  .status-done { color: #00e676; font-weight: bold; }
</style>
</head>
<body>
<div class="app">
  <div class="header"><h1>ADMIN DASHBOARD</h1></div>

  <div id="authView" class="card" style="max-width:400px; margin:0 auto;">
    <h2>Đăng Nhập</h2>
    <input id="adminPass" type="password" placeholder="Mật khẩu (admin123)">
    <button onclick="login()" style="width:100%">VÀO HỆ THỐNG</button>
  </div>

  <div id="adminPanel" class="hidden">
    <div class="card" style="text-align:right; padding:10px 20px;">
       <button onclick="location.reload()">Đăng Xuất</button>
    </div>

    <!-- TẠO KEY -->
    <div class="card">
      <h2>Tạo Key Kích Hoạt</h2>
      <div style="display:flex; gap:10px; margin-bottom:10px;">
        <select id="keyDuration" style="flex:1;">
          <option value="1">1 Ngày</option>
          <option value="7">1 Tuần</option>
          <option value="30">1 Tháng</option>
          <option value="0">Vĩnh Viễn</option>
        </select>
        <button class="btn-c" onclick="createKey()" style="flex:1;">Tạo Key</button>
      </div>
      <div id="keyResult" style="background:#000; padding:15px; border:1px dashed var(--gold); color:var(--gold); text-align:center; font-size:1.2rem; font-weight:bold; display:none; letter-spacing:1px;"></div>
    </div>

    <!-- DUYỆT NẠP -->
    <div class="card">
      <h2>Duyệt Nạp Tiền</h2>
      <table>
        <thead>
          <tr>
            <th>Mã TB</th><th>Hình thức</th><th>IP / Tỉnh</th><th>Thiết bị</th><th>Thông tin</th><th>Hành động</th>
          </tr>
        </thead>
        <tbody id="depList">
          <!-- Dữ liệu render bằng JS -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  // DÙNG CHUNG CONFIG VỚI FILE INDEX
  const firebaseConfig = {
    apiKey: "AIzaSyAaQg91q7wMeQ4kXyCnOQuolvN_KmJoHBI",
    authDomain: "vip1-c45cb.firebaseapp.com",
    projectId: "vip1-c45cb",
    storageBucket: "vip1-c45cb.firebasestorage.app",
    messagingSenderId: "191209527323",
    appId: "1:191209527323:web:b908c85ad00bfb6c2ac0be",
    databaseURL: "https://vip1-c45cb-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1561068482504691742/R5_eAJ4B5QaQ7iGpCORqd8ZPwTiYDVJuUucjiiYqaMS4NjfN-zQ6cAvupv-IW9lN54Ke";

  // 1. ĐĂNG NHẬP
  function login() {
    if(document.getElementById('adminPass').value === "admin123") {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      loadDeposits();
    } else {
      alert("Sai mật khẩu!");
    }
  }

  // 2. TẠO KEY
  function createKey() {
    const days = parseInt(document.getElementById('keyDuration').value);
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let key = "HB-";
    for(let i=0; i<12; i++) {
      if(i === 4 || i === 8) key += "-";
      key += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    
    let expireTime = 0;
    if(days > 0) {
      expireTime = Date.now() + (days * 24 * 60 * 60 * 1000);
    }

    db.ref('keys/' + key).set({
      duration: days === 0 ? "Vĩnh viễn" : days + " Ngày",
      expire: expireTime,
      createdAt: new Date().toLocaleString('vi-VN')
    }).then(() => {
      let el = document.getElementById('keyResult');
      el.style.display = "block";
      el.innerText = key;
    });
  }

  // 3. LOAD ĐƠN NẠP
  function loadDeposits() {
    const depList = document.getElementById('depList');
    db.ref('deposits').on('value', snap => {
      depList.innerHTML = "";
      if(!snap.exists()) {
        depList.innerHTML = "<tr><td colspan='6' style='text-align:center'>Chưa có đơn nào</td></tr>";
        return;
      }

      // Sắp xếp mới nhất lên đầu
      const data = snap.val();
      const arr = Object.keys(data).map(key => ({ id: key, ...data[key] })).sort((a,b)=>b.timestamp - a.timestamp);

      arr.forEach(dep => {
        const statusClass = dep.status === 'pending' ? 'status-pending' : 'status-done';
        const btn = dep.status === 'pending' ? `<button class="btn-g" onclick="approveDeposit('${dep.id}')">Duyệt</button>` : 'Đã duyệt';
        let info = dep.method === 'Thẻ Cào' ? `${dep.type} - ${dep.amount}đ` : `Nội dung: ${dep.deviceCode}`;
        
        depList.innerHTML += `
          <tr>
            <td style="color:var(--gold); font-weight:bold;">${dep.deviceCode}</td>
            <td>${dep.method}</td>
            <td>
              <b>IP:</b> ${dep.ip}<br>
              <small style="color:#aaa;">${dep.location}</small>
            </td>
            <td>${dep.device}</td>
            <td>${info}</td>
            <td>${btn}</td>
          </tr>
        `;
      });
    });
  }

  // 4. DUYỆT ĐƠN
  function approveDeposit(id) {
    if(!confirm("Xác nhận đã nhận được tiền và duyệt đơn này?")) return;
    
    db.ref('deposits/' + id).update({ status: 'approved' }).then(() => {
      // Báo lại Discord
      fetch(DISCORD_WEBHOOK, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: "Admin Hai×bo",
          embeds: [{
            title: "✅ ĐÃ DUYỆT ĐƠN NẠP!",
            color: 65280,
            description: `Admin vừa duyệt đơn nạp mã đơn: **${id}**`,
            timestamp: new Date().toISOString()
          }]
        })
      });
    });
  }
</script>
</body>
</html>
