<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN · Hai×bo</title>
<style>
  :root{ --bg:#050a0f; --panel:#0a141e; --line:#14324a; --txt:#e0f7fa; --cyan:#00e5ff; --green:#00e676; --red:#ff5252; --yel:#ffd166; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{ background:radial-gradient(circle at 50% -20%, #0f2a3f 0%, var(--bg) 70%); color:var(--txt); font-family:system-ui,sans-serif; padding:20px; display:flex; justify-content:center; min-height:100vh; }
  .app{ width:100%; max-width:1000px; }
  .header{ text-align:center; margin-bottom:20px; }
  .header h1{ color:var(--cyan); font-size:2rem; }
  .card{ background:linear-gradient(180deg,var(--panel) 0%, #0e1c28 100%); padding:20px; border-radius:12px; border:1px solid var(--line); margin-bottom:20px; }
  h2{ color:var(--cyan); margin-bottom:15px; font-size:1.1rem; border-bottom:1px solid var(--line); padding-bottom:5px; text-transform:uppercase;}
  input{ width:100%; padding:10px; margin-bottom:10px; background:#060f16; border:1px solid var(--line); color:#fff; border-radius:6px; outline:none;}
  button{ background:var(--cyan); color:#000; border:none; padding:10px 15px; border-radius:6px; cursor:pointer; font-weight:bold; }
  .btn-sm{ padding:5px 8px; font-size:0.75rem; border-radius:4px; }
  .btn-g{ background:var(--green); color:#000; } .btn-r{ background:var(--red); color:#fff; }
  table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:0.9rem; }
  th,td{ padding:10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top;}
  th{ color:var(--cyan); font-size:0.8rem; }
  .hidden{ display:none!important; }
  .msg{ color:var(--red); margin-top:10px; font-weight:bold; }
  .header-bar{ display:flex; justify-content:space-between; align-items:center; background:#060f16; padding:10px 20px; border-radius:8px; margin-bottom:20px; border:1px solid var(--line); }
  .dev-list{ font-size:0.8rem; margin:0; padding:0; list-style:none; color:#ccc;}
  .dev-item{ border-bottom:1px dashed #333; padding:4px 0; display:flex; justify-content:space-between; align-items:center;}
  .tag { padding:2px 6px; border-radius:4px; font-weight:bold; font-size:0.75rem;}
  .tag-u { background:var(--yel); color:#000; } .tag-d { background:var(--green); color:#000; }
</style>
</head>
<body>
<div class="app">
  <div class="header"><h1>ADMIN HAI×BO</h1></div>

  <div id="authView" class="card" style="max-width:400px; margin:0 auto;">
    <h2>Đăng Nhập</h2>
    <input id="adminPass" type="password" placeholder="Mật khẩu (admin123)">
    <button onclick="Admin.login()" style="width:100%">Vào Hệ Thống</button>
    <div id="authMsg" class="msg"></div>
  </div>

  <div id="adminPanel" class="hidden">
    <div class="header-bar">
      <div style="color:var(--cyan); font-weight:bold">QUẢN LÝ</div>
      <div>
        <button class="btn-sm btn-g" onclick="Admin.render()">🔄 Làm Mới</button>
        <button class="btn-sm btn-r" onclick="location.reload()">Đăng Xuất</button>
      </div>
    </div>

    <div class="card">
      <h2>Check Thẻ & Nạp</h2>
      <table>
        <thead><tr><th>User</th><th>Thông Tin</th><th>Mệnh Giá</th><th>Trạng Thái</th><th>Thao Tác</th></tr></thead>
        <tbody id="depList"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Quản Lý User & Thiết Bị</h2>
      <table>
        <thead><tr><th>Tên / Xu</th><th>IP & Thiết Bị</th><th>Thao tác</th></tr></thead>
        <tbody id="userList"></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
  // IMPORT FIREBASE
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // ================= ĐIỀN CONFIG CỦA MÀY VÀO ĐÂY =================
  const firebaseConfig = {
    apiKey: "ĐIỀN_API_KEY",
    authDomain: "ĐIỀN_AUTH_DOMAIN",
    projectId: "ĐIỀN_PROJECT_ID",
    storageBucket: "ĐIỀN_STORAGE_BUCKET",
    messagingSenderId: "ĐIỀN_SENDER_ID",
    appId: "ĐIỀN_APP_ID",
    databaseURL: "https://ĐIỀN_PROJECT_ID-default-rtdb.firebaseio.com"
  };
  // ===============================================================

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.Admin = {
    login(){
      if(document.getElementById('adminPass').value !== "admin123") return document.getElementById('authMsg').textContent="Sai pass!";
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      this.render();
    },
    async render(){
      // 1. Tải Đơn Nạp
      const snapD = await get(ref(db, 'deposits'));
      let deps = snapD.exists() ? Object.values(snapD.val()) : [];
      deps.sort((a,b)=>b.created_at - a.created_at);
      
      document.getElementById('depList').innerHTML = deps.length ? deps.map(d => {
        let xu = d.amount===10000?20 : d.amount===100000?220 : 1000;
        let st = d.status==='pending' ? `<span class="tag tag-u">CHƯA DÙNG</span>` : `<span class="tag tag-d">ĐÃ DÙNG</span>`;
        return `<tr>
          <td style="font-weight:bold;color:#fff">${d.username}</td>
          <td style="font-size:0.85rem;color:#ccc">${d.info}</td>
          <td style="color:var(--green);font-weight:bold">${d.amount.toLocaleString()}đ (${xu}x)</td>
          <td>${st}</td>
          <td>${d.status==='pending'?`<button class="btn-sm btn-g" onclick="Admin.approve('${d.id}')">Duyệt</button>`:'Xong'}</td>
        </tr>`;
      }).join('') : `<tr><td colspan="5" style="text-align:center;color:#666">Trống</td></tr>`;

      // 2. Tải User
      const snapU = await get(ref(db, 'users'));
      let users = snapU.exists() ? Object.values(snapU.val()) : [];
      document.getElementById('userList').innerHTML = users.length ? users.map(u => {
        let devHtml = '<ul class="dev-list">';
        if(u.devices && u.devices.length > 0) {
          u.devices.forEach(dev => {
            devHtml += `<li class="dev-item"><span>${dev.name} (${dev.ip})</span> <button class="btn-sm btn-r" onclick="Admin.kick('${u.id}', '${dev.id}')">Đá</button></li>`;
          });
        } else { devHtml += '<li>Chưa có</li>'; }
        devHtml += '</ul>';

        return `<tr>
          <td style="font-weight:bold;color:var(--cyan)">${u.username}<br><span style="color:var(--yel)">${u.xu||0} Xu</span></td>
          <td>${devHtml}</td>
          <td>
            <button class="btn-sm btn-g" onclick="Admin.editXu('${u.id}','add')">+ Xu</button>
            <button class="btn-sm btn-r" onclick="Admin.editXu('${u.id}','sub')">- Xu</button>
            <button class="btn-sm" style="background:#333;color:#fff;margin-top:5px" onclick="Admin.delUser('${u.id}')">Xóa</button>
          </td>
        </tr>`;
      }).join('') : `<tr><td colspan="3" style="text-align:center;color:#666">Trống</td></tr>`;
    },
    async approve(id){
      const snap = await get(ref(db, 'deposits/' + id));
      if(!snap.exists()) return;
      let dep = snap.val();
      if(dep.status !== 'pending') return;
      
      let xu = dep.amount===10000?20 : dep.amount===100000?220 : 1000;
      const snapU = await get(ref(db, 'users/' + dep.userId));
      if(snapU.exists()){
        let user = snapU.val();
        await update(ref(db, 'users/' + user.id), { xu: (user.xu||0) + xu });
      }
      await update(ref(db, 'deposits/' + id), { status: 'approved' });
      this.render();
    },
    async editXu(id, action){
      const snap = await get(ref(db, 'users/' + id));
      if(!snap.exists()) return;
      let user = snap.val();
      const str = prompt(`Nhập số Xu muốn ${action === 'add'
