<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN · Hai×bo</title>
<style>
  :root{ --bg:#050a0f; --panel:#0a141e; --line:#14324a; --txt:#e0f7fa; --cyan:#00e5ff; --green:#00e676; --red:#ff5252; --yel:#ffd166; --purple:#b57bff; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{ background:radial-gradient(circle at 50% -20%, #0f2a3f 0%, var(--bg) 70%); color:var(--txt); font-family:system-ui,sans-serif; padding:20px; display:flex; justify-content:center; min-height:100vh; }
  .app{ width:100%; max-width:1000px; }
  .header{ text-align:center; margin-bottom:20px; }
  .header h1{ color:var(--cyan); font-size:2rem; text-shadow:0 0 10px var(--cyan);}
  .card{ background:linear-gradient(180deg,var(--panel) 0%, #0e1c28 100%); padding:20px; border-radius:12px; border:1px solid var(--line); margin-bottom:20px; }
  h2{ color:var(--cyan); margin-bottom:15px; font-size:1.1rem; border-bottom:1px solid var(--line); padding-bottom:5px; text-transform:uppercase;}
  input{ width:100%; padding:10px; margin-bottom:10px; background:#060f16; border:1px solid var(--line); color:#fff; border-radius:6px; outline:none;}
  input:focus{ border-color:var(--cyan); }
  button{ background:var(--cyan); color:#000; border:none; padding:10px 15px; border-radius:6px; cursor:pointer; font-weight:bold; transition:0.2s; }
  button:hover{ filter:brightness(0.8); }
  .btn-sm{ padding:5px 8px; font-size:0.75rem; border-radius:4px; }
  .btn-g{ background:var(--green); color:#000; } .btn-r{ background:var(--red); color:#fff; } .btn-p{ background:var(--purple); color:#fff;}
  table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:0.9rem; }
  th,td{ padding:10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top;}
  th{ color:var(--cyan); font-size:0.8rem; }
  .hidden{ display:none!important; }
  .msg{ color:var(--red); margin-top:10px; font-weight:bold; }
  .header-bar{ display:flex; justify-content:space-between; align-items:center; background:#060f16; padding:10px 20px; border-radius:8px; margin-bottom:20px; border:1px solid var(--line); }
  .dev-list{ font-size:0.8rem; margin:0; padding:0; list-style:none; color:#ccc;}
  .dev-item{ border-bottom:1px dashed #333; padding:4px 0; display:flex; justify-content:space-between; align-items:center;}
  .tag-card { display:inline-block; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:0.75rem;}
  .tag-unused { background:var(--yel); color:#000; }
  .tag-used { background:var(--green); color:#000; }
</style>
</head>
<body>
<div class="app">
  <div class="header"><h1>ADMIN HAI×BO</h1></div>

  <!-- FORM ĐĂNG NHẬP -->
  <div id="authView" class="card" style="max-width:400px; margin:0 auto;">
    <h2>Đăng Nhập</h2>
    <input id="adminPass" type="password" placeholder="Nhập mật khẩu (mặc định: admin123)">
    <button onclick="Admin.login()" style="width:100%">Vào Hệ Thống</button>
    <div id="authMsg" class="msg"></div>
  </div>

  <!-- BẢNG QUẢN TRỊ -->
  <div id="adminPanel" class="hidden">
    <div class="header-bar">
      <div style="color:var(--cyan); font-weight:bold">HỆ THỐNG QUẢN LÝ</div>
      <div>
        <button class="btn-sm btn-g" onclick="Admin.render()">🔄 Làm Mới</button>
        <button class="btn-sm btn-p" onclick="Admin.changePass()">Đổi Pass</button>
        <button class="btn-sm btn-r" onclick="location.reload()">Đăng Xuất</button>
      </div>
    </div>

    <div class="card">
      <h2>Lịch Sử Nạp / Auto Check Thẻ</h2>
      <table>
        <thead><tr><th>User</th><th>Thông Tin</th><th>Mệnh Giá</th><th>Trạng Thái Thẻ</th><th>Thao Tác</th></tr></thead>
        <tbody id="depList"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Quản Lý User & Thiết Bị</h2>
      <table>
        <thead><tr><th>Tên / Số Dư</th><th>IP & Thiết Bị Đang Đăng Nhập</th><th>Thao tác</th></tr></thead>
        <tbody id="userList"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const DB = {
  getUsers(){ return JSON.parse(localStorage.getItem('pred_users')) || []; },
  saveUsers(u){ localStorage.setItem('pred_users', JSON.stringify(u)); },
  getDeps(){ return JSON.parse(localStorage.getItem('pred_deposits')) || []; },
  saveDeps(d){ localStorage.setItem('pred_deposits', JSON.stringify(d)); },
  getU(id){ return this.getUsers().find(u=>u.id===id); },
  updateU(id,data){ let u=this.getUsers(); let i=u.findIndex(x=>x.id===id); if(i>-1){u[i]={...u[i],...data}; this.saveUsers(u);} },
  getPass(){ return localStorage.getItem('admin_pass')||"admin123"; },
  setPass(p){ localStorage.setItem('admin_pass', p); }
};

const Admin = {
  login(){
    const p = document.getElementById('adminPass').value;
    if(p !== DB.getPass()){ 
      document.getElementById('authMsg').textContent = "Sai mật khẩu!";
      return; 
    }
    document.getElementById('authView').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    this.render();
  },
  changePass(){
    const p = prompt("Nhập mật khẩu Admin mới:"); 
    if(p && p.trim() !== ""){ 
      DB.setPass(p.trim()); 
      alert("Đã đổi mật khẩu thành công!"); 
    }
  },
  render(){
    // 1. Render Nạp / Check Thẻ
    const deps = DB.getDeps().sort((a,b)=>b.created_at-a.created_at);
    document.getElementById('depList').innerHTML = deps.length ? deps.map(d => {
      let xu = d.amount===10000?20 : d.amount===100000?220 : 1000;
      let statusHtml = d.status==='pending' 
        ? `<span class="tag-card tag-unused">CHƯA DÙNG</span>` 
        : `<span class="tag-card tag-used">ĐÃ DÙNG</span>`;
      
      return `<tr>
        <td style="font-weight:bold;color:#fff">${d.username}</td>
        <td style="font-size:0.85rem;color:#ccc">${d.info}</td>
        <td style="color:var(--green);font-weight:bold">${d.amount.toLocaleString()}đ (${xu}x)</td>
        <td>${statusHtml}</td>
        <td>${d.status==='pending'?`<button class="btn-sm btn-g" onclick="Admin.approve(${d.id})">Duyệt & Cộng Xu</button>`:'Hoàn tất'}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="5" style="text-align:center;color:#666">Chưa có đơn nạp</td></tr>`;

    // 2. Render User & Thiết bị
    const users = DB.getUsers();
    document.getElementById('userList').innerHTML = users.length ? users.map(u => {
      let devHtml = '<ul class="dev-list">';
      if(u.devices && u.devices.length > 0) {
        u.devices.forEach(d => {
          devHtml += `<li class="dev-item"><span>${d.name} (${d.ip})<br><small style="color:#666">${d.time}</small></span> <button class="btn-sm btn-r" onclick="Admin.kickDevice(${u.id}, '${d.id}')">Đá</button></li>`;
        });
      } else { devHtml += '<li>Chưa có thiết bị</li>'; }
      devHtml += '</ul>';

      return `<tr>
        <td style="font-weight:bold;color:var(--cyan)">${u.username}<br><span style="color:var(--yel)">${u.xu||0} Xu</span></td>
        <td>${devHtml}</td>
        <td>
          <button class="btn-sm btn-g" onclick="Admin.editXu(${u.id},'add')">+ Xu</button>
          <button class="btn-sm btn-r" onclick="Admin.editXu(${u.id},'sub')">- Xu</button>
          <button class="btn-sm" style="background:#333;color:#fff;margin-top:5px" onclick="Admin.delUser(${u.id})">Xóa User</button>
        </td>
      </tr>`;
    }).join('') : `<tr><td colspan="3" style="text-align:center;color:#666">Chưa có user</td></tr>`;
  },
  approve(id){
    let deps = DB.getDeps();
    let dep = deps.find(x=>x.id===id);
    if(!dep || dep.status !== 'pending') return;
    
    let xu = dep.amount===10000?20 : dep.amount===100000?220 : 1000;
    let user = DB.getU(dep.userId);
    if(user) DB.updateU(user.id, { xu: (user.xu||0) + xu });
    
    dep.status = 'approved';
    DB.saveDeps(deps);
    this.render();
  },
  editXu(id, action){
    let user = DB.getU(id);
    if(!user) return;
    const str = prompt(`Nhập số Xu muốn ${action === 'add' ? 'CỘNG' : 'TRỪ'} cho [${user.username}]:`, "10");
    if(!str) return;
    const amount = parseInt(str);
    if(isNaN(amount) || amount <= 0) return alert("Số xu không hợp lệ!");

    let newXu = user.xu || 0;
    if(action === 'add') newXu += amount;
    else {
      if(newXu < amount) return alert("Không đủ xu để trừ!");
      newXu -= amount;
    }
    DB.updateU(id, { xu: newXu });
    this.render();
  },
  kickDevice(userId, deviceId){
    if(!confirm("Đá thiết bị này ra khỏi tài khoản?")) return;
    let user = DB.getU(userId);
    if(!user) return;
    let newDevs = user.devices.filter(d => d.id !== deviceId);
    DB.updateU(userId, { devices: newDevs });
    this.render();
  },
  delUser(id){
    if(!confirm("Xóa vĩnh viễn user này? (Không thể hoàn tác)")) return;
    let users = DB.getUsers().filter(u => u.id !== id);
    DB.saveUsers(users); 
    this.render();
  }
};
</script>
</body>
</html>
