<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN · Hai×bo</title>
<style>
  :root{ --bg:#0a0000; --panel:#1a0000; --line:#551111; --txt:#ffe6e6; --red:#ff3333; --gold:#ffd700; --green:#00e676; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{ background:radial-gradient(circle at 50% -20%, #330000 0%, var(--bg) 70%); color:var(--txt); font-family:system-ui,sans-serif; padding:20px; display:flex; justify-content:center; min-height:100vh; }
  .app{ width:100%; max-width:1000px; }
  .header{ text-align:center; margin-bottom:20px; }
  .header h1{ color:var(--red); font-size:2rem; text-shadow:0 0 15px var(--red); letter-spacing: 2px;}
  .card{ background:linear-gradient(180deg,rgba(30,0,0,0.9) 0%, #0a0000 100%); padding:20px; border-radius:12px; border:1px solid var(--line); margin-bottom:20px; box-shadow: 0 0 10px rgba(255,0,0,0.1);}
  h2{ color:var(--red); margin-bottom:15px; font-size:1.1rem; border-bottom:1px solid var(--line); padding-bottom:5px; text-transform:uppercase;}
  input{ width:100%; padding:10px; margin-bottom:10px; background:#000; border:1px solid var(--line); color:#fff; border-radius:6px; outline:none;}
  input:focus{ border-color: var(--red); }
  button{ background:var(--red); color:#fff; border:none; padding:10px 15px; border-radius:6px; cursor:pointer; font-weight:bold; transition: 0.2s;}
  button:hover{ box-shadow:0 0 10px var(--red); }
  .btn-sm{ padding:6px 10px; font-size:0.75rem; border-radius:4px; }
  .btn-g{ background:var(--green); color:#000; } .btn-r{ background:#551111; color:#fff; } .btn-p{ background:var(--gold); color:#000;}
  table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:0.9rem; }
  th,td{ padding:10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top;}
  th{ color:var(--gold); font-size:0.8rem; }
  .hidden{ display:none!important; }
  .msg{ color:var(--red); margin-top:10px; font-weight:bold; }
  .header-bar{ display:flex; justify-content:space-between; align-items:center; background:#0a0000; padding:10px 20px; border-radius:8px; margin-bottom:20px; border:1px solid var(--red); flex-wrap:wrap; gap:10px;}
  .dev-list{ font-size:0.8rem; margin:0; padding:0; list-style:none; color:#ccc;}
  .dev-item{ border-bottom:1px dashed var(--line); padding:6px 0; display:flex; justify-content:space-between; align-items:center;}
  .tag { padding:2px 6px; border-radius:4px; font-weight:bold; font-size:0.75rem;}
  .tag-u { background:var(--gold); color:#000; } .tag-d { background:var(--green); color:#000; }
</style>
</head>
<body>
<div class="app">
  <div class="header"><h1>ADMIN HAI×BO</h1></div>

  <div id="authView" class="card" style="max-width:400px; margin:0 auto;">
    <h2>Đăng Nhập</h2>
    <input id="adminPass" type="password" placeholder="Mật khẩu...">
    <button onclick="Admin.login()" style="width:100%">Vào Hệ Thống</button>
    <div id="authMsg" class="msg"></div>
  </div>

  <div id="adminPanel" class="hidden">
    <div class="header-bar">
      <div style="color:var(--red); font-weight:bold">QUẢN LÝ</div>
      <div style="display:flex; gap:5px; flex-wrap:wrap;">
        <button class="btn-sm btn-g" onclick="Admin.render()">🔄 Làm Mới</button>
        <button class="btn-sm btn-p" onclick="Admin.changePass()">Đổi Pass</button>
        <button class="btn-sm btn-r" onclick="Admin.clearDeposits()">Xóa Lịch Sử</button>
        <button class="btn-sm btn-r" onclick="location.reload()">Thoát</button>
      </div>
    </div>

    <div class="card">
      <h2>Check Thẻ & Nạp</h2>
      <table>
        <thead><tr><th>User</th><th>Thông Tin</th><th>Mệnh Giá</th><th>Trạng Thái</th><th>Thao Tác</th></tr></thead>
        <tbody id="depList"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Quản Lý User & Thiết Bị (IP)</h2>
      <table>
        <thead><tr><th>Tên / Xu</th><th>IP & Thiết Bị Đang Đăng Nhập</th><th>Thao tác</th></tr></thead>
        <tbody id="userList"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  window.onerror = function(msg, url, line) { alert("LỖI CODE: " + msg + " (Dòng " + line + ")"); };

  const firebaseConfig = {
    apiKey: "AIzaSyAaQg91q7wMeQ4kXyCnOQuolvN_KmJoHBI",
    authDomain: "vip1-c45cb.firebaseapp.com",
    projectId: "vip1-c45cb",
    storageBucket: "vip1-c45cb.firebasestorage.app",
    messagingSenderId: "191209527323",
    appId: "1:191209527323:web:b908c85ad00bfb6c2ac0be",
    databaseURL: "https://vip1-c45cb-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const getPass = () => localStorage.getItem('admin_pass') || "admin123";

  const Admin = {
    login: function() {
      if(document.getElementById('adminPass').value !== getPass()) {
        return document.getElementById('authMsg').textContent="Sai mật khẩu!";
      }
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      this.render();
    },

    changePass: function() {
      let newPass = prompt("Nhập mật khẩu mới (hiện tại: " + getPass() + "):");
      if(newPass && newPass.trim() !== "") {
        localStorage.setItem('admin_pass', newPass.trim());
        alert("Đã đổi mật khẩu thành công! Lần sau đăng nhập bằng pass mới.");
      }
    },

    clearDeposits: function() {
      if(confirm("Mày có chắc muốn xóa TOÀN BỘ lịch sử nạp tiền? Hành động này không thể hoàn tác!")) {
        db.ref('deposits').remove().then(() => {
          alert("Đã xóa sạch lịch sử nạp!");
          Admin.render();
        });
      }
    },

    render: function() {
      db.ref('deposits').once('value').then(snapD => {
        let deps = snapD.val() ? Object.values(snapD.val()) : [];
        deps.sort((a,b)=>b.created_at - a.created_at);
        
        document.getElementById('depList').innerHTML = deps.length ? deps.map(d => {
          let xu = d.amount===10000?20 : d.amount===100000?220 : 1000;
          let st = d.status==='pending' ? `<span class="tag tag-u">CHƯA DUYỆT</span>` : `<span class="tag tag-d">ĐÃ DUYỆT</span>`;
          return `<tr>
            <td style="font-weight:bold;color:#fff">${d.username}</td>
            <td style="font-size:0.85rem;color:#ccc">${d.info}</td>
            <td style="color:var(--green);font-weight:bold">${d.amount.toLocaleString()}đ (${xu}x)</td>
            <td>${st}</td>
            <td>${d.status==='pending'?`<button class="btn-sm btn-g" onclick="Admin.approve('${d.id}')">Duyệt</button>`:'Xong'}</td>
          </tr>`;
        }).join('') : `<tr><td colspan="5" style="text-align:center;color:#666">Trống</td></tr>`;
      });

      db.ref('users').once('value').then(snapU => {
        let users = snapU.val() ? Object.values(snapU.val()) : [];
        document.getElementById('userList').innerHTML = users.length ? users.map(u => {
          let devHtml = '<ul class="dev-list">';
          if(u.devices && u.devices.length > 0) {
            u.devices.forEach(dev => {
              devHtml += `<li class="dev-item"><span><b>IP:</b> ${dev.ip} <br><small>${dev.name} - ${dev.time}</small></span> <button class="btn-sm btn-r" onclick="Admin.kick('${u.id}', '${dev.id}')">Đá</button></li>`;
            });
          } else { devHtml += '<li>Chưa có IP</li>'; }
          devHtml += '</ul>';

          return `<tr>
            <td style="font-weight:bold;color:var(--gold)">${u.username}<br><span style="color:var(--green)">${u.xu||0} Xu</span></td>
            <td>${devHtml}</td>
            <td>
              <button class="btn-sm btn-g" onclick="Admin.editXu('${u.id}','add')">+ Xu</button>
              <button class="btn-sm btn-r" onclick="Admin.editXu('${u.id}','sub')">- Xu</button>
              <button class="btn-sm" style="background:#333;color:#fff;margin-top:5px" onclick="Admin.delUser('${u.id}')">Xóa</button>
            </td>
          </tr>`;
        }).join('') : `<tr><td colspan="3" style="text-align:center;color:#666">Trống</td></tr>`;
      });
    },

    approve: function(id) {
      db.ref('deposits/' + id).once('value').then(snap => {
        if(!snap.exists()) return;
        let dep = snap.val();
        if(dep.status !== 'pending') return;
        
        let xu = dep.amount===10000?20 : dep.amount===100000?220 : 1000;
        db.ref('users/' + dep.userId).once('value').then(snapU => {
          if(snapU.exists()){
            let user = snapU.val();
            db.ref('users/' + user.id).update({ xu: (user.xu||0) + xu }).then(() => {
              db.ref('deposits/' + id).update({ status: 'approved' }).then(() => { Admin.render(); });
            });
          }
        });
      });
    },

    editXu: function(id, action) {
      db.ref('users/' + id).once('value').then(snap => {
        if(!snap.exists()) return;
        let user = snap.val();
        const str = prompt(`Nhập số Xu muốn ${action === 'add' ? 'CỘNG' : 'TRỪ'} cho [${user.username}]:`, "10");
        if(!str) return;
        const amount = parseInt(str);
        if(isNaN(amount) || amount <= 0) return alert("Sai số!");
        
        let newXu = user.xu || 0;
        if(action === 'add') newXu += amount;
        else { if(newXu < amount) return alert("Không đủ xu!"); newXu -= amount; }
        
        db.ref('users/' + id).update({ xu: newXu }).then(() => { Admin.render(); });
      });
    },

    kick: function(userId, deviceId) {
      if(!confirm("Đá thiết bị này ra khỏi tài khoản?")) return;
      db.ref('users/' + userId).once('value').then(snap => {
        if(!snap.exists()) return;
        let user = snap.val();
        let newDevs = user.devices.filter(d => d.id !== deviceId);
        db.ref('users/' + userId).update({ devices: newDevs }).then(() => { Admin.render(); });
      });
    },

    delUser: function(id) {
      if(!confirm("Xóa vĩnh viễn user này?")) return;
      db.ref('users/' + id).remove().then(() => { Admin.render(); });
    }
  };
</script>
</body>
</html>
