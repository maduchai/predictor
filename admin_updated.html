<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LARP Tài Xỉu · Predictor</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#151923; --panel2:#1c2130;
    --line:#2a3142; --txt:#d6dbe6; --dim:#7b8499;
    --cyan:#38e1d6; --green:#3ddc84; --red:#ff5c5c; --yel:#ffd166;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#1a2030 0%,var(--bg) 60%);
    color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;
    min-height:100vh;padding:24px;display:flex;justify-content:center;
  }
  .app{width:100%;max-width:640px}
  .banner{text-align:center;margin-bottom:20px}
  .banner h1{font-size:1.4rem;letter-spacing:2px;color:var(--cyan);
    text-shadow:0 0 18px rgba(56,225,214,.35);font-weight:800}
  .banner p{color:var(--dim);font-size:.75rem;margin-top:4px;letter-spacing:1px}
  .card{
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    border:1px solid var(--line);border-radius:16px;padding:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.03);
    margin-bottom:16px;
  }
  h2{font-size:.88rem;letter-spacing:1.5px;color:var(--cyan);margin-bottom:14px;
     text-transform:uppercase;display:flex;align-items:center;gap:8px}
  h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 10px var(--cyan)}
  input{
    width:100%;background:#0b0e14;border:1px solid var(--line);color:var(--txt);
    padding:11px 13px;border-radius:10px;font-size:.9rem;outline:none;transition:.15s;
    font-family:inherit;
  }
  input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,225,214,.12)}
  .row{display:flex;gap:10px;margin-bottom:10px}
  .row>*{flex:1}
  button{
    cursor:pointer;border:none;border-radius:10px;padding:11px 16px;
    font-size:.86rem;font-weight:700;letter-spacing:.5px;transition:.15s;
    font-family:inherit;color:#08110f;
  }
  button:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(180deg,var(--cyan),#24b8ae)}
  .btn-primary:hover{box-shadow:0 0 20px rgba(56,225,214,.4)}
  .btn-green{background:linear-gradient(180deg,var(--green),#2bb56b)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .btn-ghost:hover{border-color:var(--cyan);color:var(--cyan)}
  .btn-danger{background:linear-gradient(180deg,var(--red),#c93d3d);color:#fff}
  .btn-sm{padding:7px 11px;font-size:.76rem;border-radius:8px}
  .pred-box{
    text-align:center;padding:28px 16px;border-radius:14px;margin:14px 0;
    background:#0b0e14;border:1px solid var(--line);position:relative;overflow:hidden;
  }
  .pred-box::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 0%,rgba(56,225,214,.08),transparent 60%);
  }
  .pred-label{font-size:.72rem;color:var(--dim);letter-spacing:2px;margin-bottom:8px}
  .pred-value{font-size:2.8rem;font-weight:900;letter-spacing:5px;position:relative}
  .pred-value.tai{color:var(--green);text-shadow:0 0 30px rgba(61,220,132,.5)}
  .pred-value.xiu{color:var(--yel);text-shadow:0 0 30px rgba(255,209,102,.5)}
  .pred-meta{font-size:.78rem;color:var(--dim);margin-top:14px;line-height:1.7;position:relative}
  .pred-meta b{color:var(--txt)}
  .conf-bar{height:6px;background:#0b0e14;border-radius:6px;margin-top:14px;overflow:hidden}
  .conf-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--green));
    transition:width .5s ease;box-shadow:0 0 12px rgba(56,225,214,.5)}
  .hist-list{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
  .hist-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 13px;background:#0b0e14;border-radius:9px;border:1px solid var(--line);
    font-size:.82rem;
  }
  .tag{padding:2px 10px;border-radius:20px;font-weight:700;font-size:.72rem;letter-spacing:1px}
  .tag.tai{background:rgba(61,220,132,.15);color:var(--green)}
  .tag.xiu{background:rgba(255,209,102,.15);color:var(--yel)}
  .msg{padding:10px 13px;border-radius:10px;font-size:.85rem;margin-top:10px}
  .msg.ok{background:rgba(61,220,132,.1);color:var(--green);border:1px solid rgba(61,220,132,.3)}
  .msg.err{background:rgba(255,92,92,.1);color:var(--red);border:1px solid rgba(255,92,92,.3)}
  .scroll::-webkit-scrollbar{width:6px}
  .scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}
  .footer{text-align:center;color:var(--dim);font-size:.72rem;margin-top:18px;letter-spacing:.5px;line-height:1.8}
  .footer a{color:var(--cyan);text-decoration:none}
  .stat-row{display:flex;gap:10px;margin-top:12px}
  .stat{flex:1;background:#0b0e14;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .stat .num{font-size:1.1rem;font-weight:900;color:var(--cyan)}
  .stat .lab{font-size:.65rem;color:var(--dim);letter-spacing:1px;margin-top:2px}
</style>
</head>
<body>
<div class="app">

  <div class="banner">
    <h1>◆ LARP TÀI XỈU ◆</h1>
    <p>PATTERN PREDICTOR · KHÔNG PHẢI LỜI HỨA</p>
  </div>

  <!-- PREDICT -->
  <div class="card">
    <h2>Dự đoán phiên tới</h2>
    <div class="pred-box">
      <div class="pred-label">KẾT QUẢ DỰ ĐOÁN</div>
      <div id="predValue" class="pred-value">—</div>
      <div class="conf-bar"><div id="confFill" class="conf-fill" style="width:0%"></div></div>
      <div id="predMeta" class="pred-meta">chưa có dữ liệu, nhập kết quả trước đã</div>
    </div>
    <button class="btn-primary" style="width:100%" onclick="App.predict()">🎯 Dự đoán</button>
  </div>

  <!-- INPUT -->
  <div class="card">
    <h2>Nhập kết quả phiên</h2>
    <div class="row">
      <input id="totalInput" type="number" min="3" max="18" placeholder="tổng 3 xúc xắc (3-18)">
      <button class="btn-green" style="flex:0 0 auto" onclick="App.addRound()">Ghi</button>
    </div>
    <div class="row" style="margin-bottom:0">
      <button class="btn-ghost btn-sm" onclick="App.quick(11)">+ Tài mẫu</button>
      <button class="btn-ghost btn-sm" onclick="App.quick(9)">+ Xỉu mẫu</button>
    </div>
    <div id="appMsg"></div>
  </div>

  <!-- HISTORY -->
  <div class="card">
    <h2>Lịch sử phiên</h2>
    <div class="stat-row">
      <div class="stat"><div class="num" id="stTotal">0</div><div class="lab">TỔNG</div></div>
      <div class="stat"><div class="num" id="stTai" style="color:var(--green)">0</div><div class="lab">TÀI</div></div>
      <div class="stat"><div class="num" id="stXiu" style="color:var(--yel)">0</div><div class="lab">XỈU</div></div>
    </div>
    <div style="height:12px"></div>
    <div id="histList" class="hist-list scroll"></div>
    <div style="height:12px"></div>
    <button class="btn-danger btn-sm" onclick="App.clearHistory()">Xóa toàn bộ lịch sử</button>
  </div>

  <div class="footer">
    join our discord server: <a href="https://discord.gg/wgy5mpDKJq" target="_blank">discord.gg/wgy5mpDKJq</a><br>
    made by @odil9 on discord
  </div>

</div>

<script>
const HIST_KEY = "larp_tx_hist";

const Store = {
  get(){ try{return JSON.parse(localStorage.getItem(HIST_KEY)||"[]")}catch{return[]} },
  save(a){ localStorage.setItem(HIST_KEY, JSON.stringify(a)) }
};

const Predictor = {
  window:20,
  stats(hist){
    if(!hist.length) return {streak:0,last:null,alt:.5,avg:10.5};
    const last = hist[hist.length-1].result;
    let streak=0;
    for(let i=hist.length-1;i>=0;i--){ if(hist[i].result===last) streak++; else break; }
    const recent = hist.slice(-this.window);
    let sw=0;
    for(let i=1;i<recent.length;i++) if(recent[i].result!==recent[i-1].result) sw++;
    const alt = recent.length>1 ? sw/(recent.length-1) : .5;
    const avg = recent.reduce((s,r)=>s+r.total,0)/recent.length;
    return {streak,last,alt,avg};
  },
  predict(hist){
    if(!hist.length){
      const g = Math.random()<.5?"TAI":"XIU";
      return {prediction:g,confidence:.5,reason:"chưa có data — coin flip",streak:0,avg:null,alt:null};
    }
    const {streak,last,alt,avg} = this.stats(hist);
    let st=0,sx=0; const reasons=[];
    if(streak>=3){
      const brk = last==="TAI"?"XIU":"TAI";
      brk==="TAI"?st+=.9:sx+=.9;
      reasons.push(`streak ${last} x${streak} → dễ bẻ (${brk})`);
    } else { last==="TAI"?st+=.15:sx+=.15; }
    if(alt>.6){
      const flip = last==="TAI"?"XIU":"TAI";
      flip==="TAI"?st+=.7:sx+=.7;
      reasons.push(`đảo phiên ${alt.toFixed(2)} → flip ${flip}`);
    } else if(alt<.35){
      last==="TAI"?st+=.5:sx+=.5;
      reasons.push(`ít đảo ${alt.toFixed(2)} → theo ${last}`);
    }
    if(avg>=12){ sx+=.6; reasons.push(`avg ${avg.toFixed(1)} cao → về Xỉu`); }
    else if(avg<=9){ st+=.6; reasons.push(`avg ${avg.toFixed(1)} thấp → về Tài`); }
    st+=Math.random()*.05; sx+=Math.random()*.05;
    const total = st+sx;
    const pred = st>sx?"TAI":"XIU";
    const conf = Math.max(st,sx)/total;
    return {prediction:pred,confidence:+conf.toFixed(3),
      reason: reasons.length?reasons.join(" · "):"tín hiệu phẳng",
      streak, avg:+avg.toFixed(2), alt:+alt.toFixed(3)};
  }
};

const UI = {
  show(id,msg,type="ok"){
    const el=document.getElementById(id);
    if(!el) return;
    el.innerHTML=`<div class="msg ${type}">${msg}</div>`;
    setTimeout(()=>{ if(el.innerHTML.includes(msg)) el.innerHTML=""; },4000);
  }
};

const App = {
  hist:[],
  init(){ this.hist = Store.get(); this.renderHistory(); },
  quick(t){ document.getElementById("totalInput").value=t; this.addRound(); },
  addRound(){
    const inp=document.getElementById("totalInput");
    const t=parseInt(inp.value,10);
    if(isNaN(t)||t<3||t>18){ UI.show("appMsg","sai rồi, 3-18 thôi","err"); return; }
    this.hist.push({total:t,result:t>=11?"TAI":"XIU",ts:Date.now()});
    Store.save(this.hist);
    inp.value="";
    UI.show("appMsg",`đã ghi ${t} (${t>=11?"TÀI":"XỈU"})`,"ok");
    this.renderHistory();
  },
  predict(){
    const r=Predictor.predict(this.hist);
    const v=document.getElementById("predValue");
    v.textContent=r.prediction;
    v.className="pred-value "+r.prediction.toLowerCase();
    document.getElementById("confFill").style.width=(r.confidence*100).toFixed(0)+"%";
    document.getElementById("predMeta").innerHTML=
      `<b>${(r.confidence*100).toFixed(0)}%</b> tự tin · ${r.reason}<br>
       streak: <b>${r.streak}</b> · avg: <b>${r.avg??"-"}</b> · đảo: <b>${r.alt??"-"}</b>`;
  },
  renderHistory(){
    const el=document.getElementById("histList");
    const tai=this.hist.filter(r=>r.result==="TAI").length;
    const xiu=this.hist.length-tai;
    document.getElementById("stTotal").textContent=this.hist.length;
    document.getElementById("stTai").textContent=tai;
    document.getElementById("stXiu").textContent=xiu;
    if(!this.hist.length){
      el.innerHTML=`<div style="color:var(--dim);font-size:.82rem;text-align:center;padding:20px">chưa có phiên nào</div>`;
      return;
    }
    el.innerHTML=this.hist.slice().reverse().slice(0,80).map(r=>{
      const d=new Date(r.ts);
      const pad=n=>String(n).padStart(2,"0");
      const t=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      return `<div class="hist-item">
        <span style="color:var(--dim)">${t}</span>
        <span>total <b>${r.total}</b></span>
        <span class="tag ${r.result.toLowerCase()}">${r.result}</span>
      </div>`;
    }).join("");
  },
  clearHistory(){
    if(!confirm("xóa hết lịch sử?")) return;
    this.hist=[]; Store.save([]); this.renderHistory();
  }
};

App.init();
</script>
</body>
</html>
