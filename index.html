<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Lỗi</title>
<style>
  body{ background:#111; color:#fff; font-family:sans-serif; padding:20px; text-align:center; }
  input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
  #msg { color: yellow; font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>

<h2>Test Nút Bấm</h2>
<input id="uName" placeholder="Tài khoản">
<input id="uPass" placeholder="Mật khẩu">
<button onclick="register()">BẤM ĐĂNG KÝ</button>
<div id="msg"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  // BẮT LỖI JAVASCRIPT ĐỂ HIỆN LÊN MÀN HÌNH
  window.onerror = function(msg, url, line) {
    alert("LỖI CODE JS:\n" + msg + "\nDòng: " + line);
  };

  const firebaseConfig = {
    apiKey: "AIzaSyAaQg91q7wMeQ4kXyCnOQuolvN_KmJoHBI",
    authDomain: "vip1-c45cb.firebaseapp.com",
    projectId: "vip1-c45cb",
    storageBucket: "vip1-c45cb.firebasestorage.app",
    messagingSenderId: "191209527323",
    appId: "1:191209527323:web:b908c85ad00bfb6c2ac0be",
    databaseURL: "https://vip1-c45cb-default-rtdb.firebaseio.com"
  };

  let db = null;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (e) {
    alert("LỖI KHỞI TẠO FIREBASE:\n" + e.message);
  }

  function register() {
    const u = document.getElementById('uName').value.trim();
    const p = document.getElementById('uPass').value.trim();
    const msg = document.getElementById('msg');

    if(!u || !p) {
      msg.innerText = "Nhập đủ tài khoản và mật khẩu đi!";
      return;
    }
    if(!db) {
      msg.innerText = "Firebase chưa kết nối!";
      return;
    }

    msg.innerText = "Đang kết nối Firebase...";

    db.ref('users').push({
      username: u,
      password: p,
      xu: 0
    }).then(() => {
      msg.style.color = "#00e676";
      msg.innerText = "ĐĂNG KÝ THÀNH CÔNG! Firebase đã hoạt động.";
    }).catch((error) => {
      msg.style.color = "#ff5252";
      msg.innerText = "LỖI GHI DATA: " + error.message;
    });
  }
</script>
</body>
</html>
