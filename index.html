<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOL DỰ ĐOÁN LC79</title>
    <style>
        body {
            background-color: #0a0000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at 50% 0%, #330000 0%, #0a0000 70%);
        }

        .tool-container {
            background: rgba(20, 0, 0, 0.8);
            border: 1px solid #ff3333;
            border-radius: 15px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.3);
            backdrop-filter: blur(10px);
        }

        /* THÔNG BÁO BẢO TRÌ NHẤP NHÁY */
        .maintenance-alert {
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            animation: blink 1.5s infinite;
            font-size: 14px;
            text-transform: uppercase;
        }

        @keyframes blink {
            0% { opacity: 1; box-shadow: 0 0 15px #ffcc00; }
            50% { opacity: 0.5; box-shadow: 0 0 5px #ffcc00; }
            100% { opacity: 1; box-shadow: 0 0 15px #ffcc00; }
        }

        /* KHU VỰC MÃ PHIÊN VÀ ĐẾM NGƯỢC */
        .session-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed #555;
            margin-bottom: 20px;
        }

        .session-id {
            font-size: 18px;
            font-weight: bold;
            color: #00e5ff;
        }

        .timer {
            font-size: 18px;
            font-weight: bold;
            color: #ff3333;
            font-family: monospace;
        }

        /* KHU VỰC HIỂN THỊ DỰ ĐOÁN */
        .predict-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .predict-result {
            font-size: 35px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .predict-type {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        /* KHU VỰC KHẢO SÁT (THẮNG/THUA) */
        .survey-box {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid #004400;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: none; /* Ẩn lúc đầu */
        }

        .survey-title {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-survey {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-win { background-color: #00e676; color: #000; }
        .btn-win:hover { background-color: #00c853; }
        
        .btn-loss { background-color: #ff3333; color: #fff; }
        .btn-loss:hover { background-color: #d50000; }

        /* THỐNG KÊ AI */
        .ai-stats {
            font-size: 12px;
            color: #aaa;
            text-align: left;
            background: #000;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #222;
        }
        .ai-stats span { color: #00e5ff; font-weight: bold;}
        .ai-stats .green { color: #00ff00; }
    </style>
</head>
<body>

<div class="tool-container">
    <!-- THÔNG BÁO BẢO TRÌ -->
    <div class="maintenance-alert">
        ⚠️ GAME LC79 ĐANG BẢO TRÌ ⚠️
    </div>

    <!-- MÃ PHIÊN VÀ ĐẾM NGƯỢC -->
    <div class="session-box">
        <div>
            <div style="font-size: 11px; color: #aaa;">MÃ PHIÊN</div>
            <div class="session-id" id="sessionDisplay">#45968</div>
        </div>
        <div>
            <div style="font-size: 11px; color: #aaa; text-align: right;">CHỜ KẾT QUẢ</div>
            <div class="timer" id="timerDisplay">65s</div>
        </div>
    </div>

    <!-- KẾT QUẢ DỰ ĐOÁN -->
    <div class="predict-box">
        <div id="resultContent">
            <div style="color: #ffcc00; font-style: italic;">Đang phân tích...</div>
        </div>
    </div>

    <!-- KHẢO SÁT THẮNG THUA -->
    <div class="survey-box" id="surveyBox">
        <div class="survey-title">Phiên này dự đoán có đúng không?</div>
        <div class="btn-group">
            <button class="btn-survey btn-win" onclick="recordResult(true)">THẮNG</button>
            <button class="btn-survey btn-loss" onclick="recordResult(false)">THUA</button>
        </div>
    </div>

    <!-- THỐNG KÊ AI GIẢ LẬP -->
    <div class="ai-stats">
        🧠 AI Learning Status:<br>
        Đã học: <span id="totalRounds">0</span> phiên | 
        Độ chính xác: <span class="green" id="accuracyStat">0%</span>
    </div>
</div>

<script>
    // Cấu hình
    let currentSession = 45968;
    let timeLeft = 65;
    let timerInterval = null;
    let currentPredictionType = ""; // Lưu Tài/Xỉu của phiên hiện tại để đối chiếu

    // Lấy dữ liệu AI từ bộ nhớ trình duyệt (để F5 không bị mất)
    let aiWins = parseInt(localStorage.getItem('lc79_wins')) || 0;
    let aiLosses = parseInt(localStorage.getItem('lc79_losses')) || 0;

    // Hàm tạo kết quả random (50% - 85%)
    function getRandomPrediction() {
        let percent = Math.floor(Math.random() * (85 - 50 + 1)) + 50;
        let type = Math.random() < 0.5 ? "TÀI" : "XỈU";
        return { type: type, percent: percent };
    }

    // Cập nhật thống kê AI lên màn hình
    function updateAIStats() {
        let total = aiWins + aiLosses;
        document.getElementById('totalRounds').innerText = total;
        
        if (total > 0) {
            let accuracy = Math.round((aiWins / total) * 100);
            document.getElementById('accuracyStat').innerText = accuracy + "%";
        } else {
            document.getElementById('accuracyStat').innerText = "0%";
        }
    }

    // Hàm xử lý khi bấm nút Thắng/Thua
    function recordResult(isWin) {
        // Cộng điểm
        if (isWin) {
            aiWins++;
            localStorage.setItem('lc79_wins', aiWins);
        } else {
            aiLosses++;
            localStorage.setItem('lc79_losses', aiLosses);
        }

        // Cập nhật giao diện
        updateAIStats();
        
        // Ẩn nút khảo sát đi để chờ phiên sau
        document.getElementById('surveyBox').style.display = 'none';
        
        // Hiệu ứng thông báo nhỏ
        let msg = isWin ? "✅ Đã ghi nhận: AI học được điểm cộng!" : "❌ Đã ghi nhận: AI học được điểm trừ!";
        alert(msg);
    }

    // Hàm bắt đầu đếm ngược cho phiên mới
    function startSession() {
        // Cập nhật mã phiên
        document.getElementById('sessionDisplay').innerText = "#" + currentSession;
        
        // Hiển thị trạng thái đang chờ
        document.getElementById('resultContent').innerHTML = '<div style="color: #ffcc00; font-style: italic;">Đang phân tích dữ liệu...</div>';
        
        // Ẩn nút khảo sát (nếu đang hiện từ phiên trước)
        document.getElementById('surveyBox').style.display = 'none';

        // Reset thời gian
        timeLeft = 65;
        document.getElementById('timerDisplay').innerText = timeLeft + "s";

        // Sau 2 giây, in ra kết quả dự đoán
        setTimeout(() => {
            let result = getRandomPrediction();
            currentPredictionType = result.type;
            let color = result.type === "TÀI" ? "#ff3333" : "#00e5ff"; // Tài đỏ, Xỉu xanh
            
            document.getElementById('resultContent').innerHTML = `
                <div class="predict-type" style="color: ${color}">${result.type}</div>
                <div class="predict-result">${result.percent}%</div>
            `;
            
            // Hiện nút Thắng/Thua để người dùng khảo sát
            document.getElementById('surveyBox').style.display = 'block';

        }, 2000); 

        // Chạy đồng hồ đếm ngược
        if (timerInterval) clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timerDisplay').innerText = timeLeft + "s";

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                currentSession++; // Nhảy mã phiên
                startSession();   // Bắt đầu phiên mới
            }
        }, 1000);
    }

    // Khởi chạy khi mở trang
    window.onload = function() {
        updateAIStats(); // Hiển thị thống kê cũ
        startSession();  // Bắt đầu đếm ngược
    };
</script>

</body>
</html>
