<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Hiệu Ứng Tool</title>
    <style>
        /* ĐÃ XÓA PHẦN ÉP XOAY BODY TỰ ĐỘNG Ở ĐÂY ĐỂ TRÁNH LỖI GIAO DIỆN */

        /* Thiết lập giao diện cơ bản */
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 1. HIỆU ỨNG CHỮ 7 MÀU */
        @keyframes rainbowText {
            0%   { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
            17%  { color: #ff7f00; text-shadow: 0 0 10px #ff7f00; }
            33%  { color: #ffff00; text-shadow: 0 0 10px #ffff00; }
            50%  { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
            67%  { color: #0000ff; text-shadow: 0 0 10px #0000ff; }
            83%  { color: #4b0082; text-shadow: 0 0 10px #4b0082; }
            100% { color: #9400d3; text-shadow: 0 0 10px #9400d3; }
        }

        .rainbow-text {
            animation: rainbowText 3s linear infinite;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }

        /* Giao diện form nhập key */
        .container {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
            transition: all 0.3s ease; /* Thêm hiệu ứng mượt khi xoay */
        }

        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #555;
            border-radius: 5px;
            background: #000;
            color: #fff;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            background: #00ff00;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 95%;
            color: black;
        }

        /* 2. ẨN KẾT QUẢ */
        .hidden {
            display: none !important;
        }

        /* 3. LÀM DỰ ĐOÁN TRONG SUỐT */
        .result-box {
            margin-top: 20px;
            padding: 15px;
            /* Nền trong suốt 40% */
            background: rgba(51, 51, 51, 0.4) !important; 
            /* Làm mờ hậu cảnh phía sau */
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            border: 1px dashed #ffcc00;
            border-radius: 8px;
        }

        /* 4. CSS XOAY NGANG / DỌC BẰNG NÚT BẤM */
        .xoay-ngang {
            transform: rotate(90deg) !important;
            transform-origin: center center !important;
            width: 90vh !important; /* Đảo ngược chiều rộng */
            height: 90vw !important; /* Đảo ngược chiều cao */
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            margin-top: -45vw !important;
            margin-left: -45vh !important;
            z-index: 9999 !important;
            background: #111 !important; /* Nền đen để dễ nhìn khi xoay */
        }
    </style>
</head>
<body>

    <!-- KHỐI 1: TRANG NHẬP KEY -->
    <div class="container" id="keyPage">
        <h2 class="rainbow-text">Nhập Key Để Vào Tool</h2>
        <p style="color: gray; font-size: 12px;">(Kết quả sẽ bị ẩn ở bước này)</p>
        
        <input type="text" id="keyInput" placeholder="Nhập Key Đã Mua...">
        <button onclick="checkKey()">Xác Nhận Key</button>
        
        <!-- Nút giả lập mua key -->
        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #444;">
            <p style="color: #ffcc00;">Tự động mua key</p>
            <button style="background: #ffcc00; color: black;" onclick="showResult()">MUA NGAY (Demo)</button>
        </div>
    </div>

    <!-- KHỐI 2: KẾT QUẢ (BỊ ẨN LÚC ĐẦU) -->
    <div class="container hidden" id="resultPage">
        <h2 class="rainbow-text">Kết Quả Dự Đoán</h2>
        
        <div class="result-box">
            <h1 style="color: red; font-size: 50px; margin: 0;">TÀI</h1>
        </div>

        <!-- NÚT XOAY NGANG/DỌC -->
        <button id="btnXoay" style="margin-top: 15px; background: #00ffff; color: black;" onclick="toggleXoay()">
            🔄 Xoay Ngang
        </button>
        
        <button style="margin-top: 10px; background: #555; color: white;" onclick="resetPage()">Quay Lại Trang Nhập Key</button>
    </div>

    <script>
        // Hàm giả lập kiểm tra key
        function checkKey() {
            let key = document.getElementById('keyInput').value;
            if (key === "") {
                alert("Vui lòng nhập key (Bạn có thể bấm MUA NGAY để xem demo).");
            } else {
                showResult();
            }
        }

        // Hàm ẩn trang nhập key và hiện kết quả
        function showResult() {
            document.getElementById('keyPage').classList.add('hidden');
            document.getElementById('resultPage').classList.remove('hidden');
        }

        // Hàm quay lại trang ban đầu
        function resetPage() {
            // Reset lại trạng thái xoay nếu đang xoay
            document.getElementById('resultPage').classList.remove('xoay-ngang');
            document.getElementById('btnXoay').innerText = "🔄 Xoay Ngang";
            
            document.getElementById('resultPage').classList.add('hidden');
            document.getElementById('keyPage').classList.remove('hidden');
        }

        // HÀM XỬ LÝ XOAY NGANG / DỌC
        function toggleXoay() {
            var khung = document.getElementById('resultPage');
            var btn = document.getElementById('btnXoay');
            
            // Bật/tắt class xoay-ngang
            khung.classList.toggle('xoay-ngang');
            
            // Đổi chữ trên nút
            if (khung.classList.contains('xoay-ngang')) {
                btn.innerText = "🔄 Xoay Dọc";
            } else {
                btn.innerText = "🔄 Xoay Ngang";
            }
        }
    </script>
</body>
</html>
